{"id":"choose-statistical-model","type":"skill","version":"0.2.3","title":"統計モデルを選ぶ","purpose":"研究目的とestimand、データ生成過程、研究デザインに応じて候補モデルを比較し、仮定・診断・不足情報とともに条件付きの選択を行う。","categories":["analyze","design"],"maturity":"EXECUTABLE","when_to_use":"分析モデルを設計または査読するとき。モデルを先に決めるのではなく、何を記述・予測・推定したいかを明確にした後に使う。","requires":{"concepts":["statistics.data-generating-process","statistics.population-and-sample","statistics.standard-error","statistics.confidence-interval","statistics.multiple-regression-and-glm","statistics.model-evaluation-and-generalization"]},"inputs":{"required":["research-goal","estimand-or-target","outcome-description","predictor-and-design-description","sampling-and-dependence-description"],"optional":["missingness-description","candidate-models","software-constraints"],"description":"required fields must describe the research goal, estimand or target, outcome, predictors, design, sampling and dependence; include temporal structure, prediction horizon when predictive, and missingness information when relevant."},"decision_branches":[{"condition":"research goal is descriptive","action":"モデルの目的を分布・関連・群差の記述に限定し、因果効果の解釈を付けない。","consequence":"population quantityかsample summaryかを区別し、群差・分布・関連・依存構造のどれを記述するかを固定する。"},{"condition":"research goal is predictive","action":"将来観測の予測対象、予測時点、検証方式、予測損失を定義する。","consequence":"prediction horizon、validation design、data leakage、overfitting、calibration、discrimination、外部検証を確認し、因果効果とは別の出力として扱う。"},{"condition":"research goal is causal","action":"target population、treatment、outcome、time、estimandを定義した後、exchangeability、positivity、consistency、時間順序、交絡調整戦略を確認する。","consequence":"識別条件が不明なままモデルだけを選んでも因果効果は確定できない。識別を検討してから依存構造と候補モデルを比較する。"}],"steps":[{"id":"define-goal-and-estimand","action":"causal・predictive・descriptiveを分け、誰に対する何の量を求めるかを定義する。parameter、estimator、estimateを混同しない。"},{"id":"check-causal-identification","action":"causal目的では治療割付機構、exchangeability、positivity、consistency、時間順序、交絡調整を確認する。未確認ならモデル選択から因果効果を断定しない。"},{"id":"inspect-outcome","action":"outcomeの連続・二値・count・ordinal・time-to-event、範囲、zero inflation、censoringを確認する。"},{"id":"inspect-data-structure","action":"独立性、repeated measures、cluster、階層、時系列、sample size、sparsityを確認する。"},{"id":"inspect-missingness","action":"欠測率、欠測パターン、欠測機構について分かっていることと不明点を分ける。"},{"id":"construct-candidates","action":"研究目的とデータ構造に適合する候補を複数挙げ、outcome typeだけで一つに決めない。"},{"id":"compare-assumptions","action":"linearity、独立性、分散構造、分布、リンク関数、random effects、censoring、識別仮定を候補ごとに比較する。"},{"id":"align-estimand-and-parameterization","action":"モデル係数の解釈がestimandと対応するか確認する。marginal / population-averagedとconditional / cluster-specificの違いはoutcome、link、parameterizationに依存しうるため、一般論で同一視しない。"},{"id":"plan-diagnostics","action":"残差、適合、calibration、予測性能、感度分析、cluster・時系列依存、欠測への頑健性を確認する方法を指定する。"},{"id":"make-conditional-decision","action":"推奨モデル、alternative、未確認仮定、必要な追加情報、limitationsを構造化して返す。情報不足ならinsufficient-informationとする。"}],"checks":[{"id":"purpose","rule":"outcome typeだけでモデルを決めていないか。"},{"id":"estimand","rule":"推定対象と予測対象、記述対象を明示したか。"},{"id":"causal-identification","rule":"causal目的で識別仮定と交絡調整をモデル選択より先に確認したか。"},{"id":"dependence","rule":"repeated measures、clustering、時系列依存を確認したか。"},{"id":"estimand-parameterization","rule":"marginal / population-averagedとconditional / cluster-specificの違いを確認したか。"},{"id":"assumptions","rule":"linearity、分散、独立性、分布、リンク、識別仮定を候補ごとに明示したか。"},{"id":"missingness","rule":"欠測率と欠測機構を確認し、未確認なら不確実性として出力したか。"},{"id":"diagnostics","rule":"モデル選択と診断計画をセットで提示したか。"},{"id":"causal-prediction","rule":"causal estimationとpredictionを混同していないか。"},{"id":"variable-selection","rule":"model selectionとvariable selectionを混同していないか。"},{"id":"insufficient","rule":"必要情報がないとき無理に単一モデルを推奨していないか。"}],"outputs":{"primary":{"type":"json","filename":"model-choice.json"},"sections":["decision_status","estimand","recommended_model","alternative_models","assumptions","uncertain_assumptions","data_requirements","diagnostics","missing_information","limitations"]},"failure_modes":["質問より先にモデルを選ぶ","連続値ならlinear、binaryならlogisticと機械的に決める","適合を真理や因果効果と解釈する","sample sizeだけでモデルを決める","モデル選択と変数選択を混同する","情報不足を暗黙の仮定で埋める","病院clusterや患者内反復測定を単一の独立観測として扱う","marginalとconditionalの解釈を混同する","causal識別を確認せずにモデルを選ぶ","marginalとconditionalの解釈をoutcomeやlinkに関係なく同一視する"],"worked_example":{"context":"治療効果を推定する観察コホート。病院内に患者が入り、各患者をbaseline・3か月・6か月で反復測定する。連続outcomeの欠測は8%。","decision":"decision_status: conditional。estimandは6か月時点における対象集団の平均治療効果（baselineから6か月までの効果推移全体ではない）と固定する。モデル選択の前に治療割付機構、exchangeability、positivity、consistency、時間順序、交絡調整戦略を確認する。これらが不明なら回帰モデルを選んでもATEの識別は保証できない。病院clusterと患者内反復測定という二層の依存構造があるため単純OLSは主分析にしない。","candidates":"recommended_model: not-yet-determined。6か月時点ATE、十分なcluster数、交絡調整、欠測条件、依存構造の仕様が確認できた後に一つへ決定する。alternative_models: 病院・患者の階層と患者内共分散を表現するmixed model、またはmarginal estimandを狙うGEE等のmarginal approach。GEEを使う場合も、病院clusterと患者内反復という多層依存をどの単位・共分散構造で扱うかを明示する。mixed modelとGEEでは一般に対象parameterの解釈が異なりうる。特に非線形linkではconditional / cluster-specificとmarginal / population-averagedの差が重要になるため、estimandとparameterizationの対応を確認する。","diagnostics":"assumptions: 交絡調整、positivity、時間順序、階層構造、linearity、分散構造、欠測機構。diagnostics: 残差、時間効果、病院・患者random effectsまたはworking correlation、欠測感度分析、cluster頑健性。","insufficient_information":"治療割付機構、交絡調整変数、時間順序、positivity、患者と病院の識別、欠測機構、cluster数、反復測定間隔が不明ならdecision_status: insufficient-informationとし、モデルを確定しない。","limitations":"モデル比較だけでは因果識別や測定妥当性を保証しない。"},"limitations":["モデルは現実そのものではなく仮定を持つ近似である。","候補比較だけでは因果識別や測定妥当性を保証しない。","最終選択は研究目的、データ、仮定、診断結果の組に依存する。"]}